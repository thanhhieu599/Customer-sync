<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>D&T Sapo Sync</title><link rel="stylesheet" href="ui.css">
<style>body{width:360px;padding:14px}</style></head>
<body>
  <h1>D&amp;T Sapo Sync</h1>
  <div class="muted">Đồng bộ khách hàng Sapo Omni ↔ Sapo Web</div>
  <p class="row"><span id="pill" class="pill st-off">…</span> <span id="msg"></span></p>
  <div class="muted" id="last"></div>
  <pre id="summary" hidden></pre>
  <div class="row" style="margin-top:10px">
    <button id="run" class="primary">Chạy ngay</button>
    <button id="toggle">Bật tự động</button>
    <button id="resume" hidden>Bỏ tạm nghỉ</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="omni">Mở tab Sapo Omni</button>
    <button id="opts">Cài đặt &amp; nhật ký</button>
  </div>
  <script src="popup.js"></script>
</body></html>
